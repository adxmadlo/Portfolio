<svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .ring-pulse {
        animation: ringOut 2.4s ease-out infinite;
        transform-origin: 10px 10px;
      }
      @keyframes ringOut {
        0%   { r: 4; opacity: 0.9; stroke-width: 2; }
        70%  { r: 9; opacity: 0; stroke-width: 1; }
        100% { r: 9; opacity: 0; }
      }
    </style>
  </defs>
  <circle class="ring-pulse" cx="10" cy="10" r="4" fill="none" stroke="#00d4ff"/>
  <circle cx="10" cy="10" r="4" fill="#0a0f1e" stroke="#00d4ff" stroke-width="2"/>
  <circle cx="10" cy="10" r="2" fill="#00d4ff"/>
</svg>
