<svg viewBox="0 0 280 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Adama Diallo avatar placeholder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .border-spin {
        animation: spin 12s linear infinite;
        transform-origin: 140px 170px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .glow-ring {
        animation: glowPulse 3s ease-in-out infinite;
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }
      .initials-float {
        animation: initFloat 4s ease-in-out infinite;
      }
      @keyframes initFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      .hint-blink {
        animation: hintBlink 3s ease-in-out infinite;
      }
      @keyframes hintBlink {
        0%, 70%, 100% { opacity: 0.5; }
        85% { opacity: 1; }
      }
    </style>
    <radialGradient id="avatar-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </radialGradient>
    <linearGradient id="border-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <clipPath id="frame-clip">
      <rect x="14" y="14" width="252" height="312" rx="16"/>
    </clipPath>
    <filter id="avatar-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer spinning dashed border -->
  <rect class="border-spin" x="4" y="4" width="272" height="332" rx="20"
        fill="none" stroke="url(#border-grad)" stroke-width="2"
        stroke-dasharray="18 10" opacity="0.6"/>

  <!-- Card background -->
  <rect x="14" y="14" width="252" height="312" rx="16" fill="url(#avatar-bg)" stroke="#23314a" stroke-width="1"/>

  <!-- Inner glow ring -->
  <rect class="glow-ring" x="22" y="22" width="236" height="296" rx="12"
        fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4" filter="url(#avatar-glow)"/>

  <!-- Subtle grid inside -->
  <g clip-path="url(#frame-clip)" opacity="0.07">
    <line x1="14" y1="80"  x2="266" y2="80"  stroke="#00d4ff" stroke-width="1"/>
    <line x1="14" y1="160" x2="266" y2="160" stroke="#00d4ff" stroke-width="1"/>
    <line x1="14" y1="240" x2="266" y2="240" stroke="#00d4ff" stroke-width="1"/>
    <line x1="80"  y1="14" x2="80"  y2="326" stroke="#00d4ff" stroke-width="1"/>
    <line x1="140" y1="14" x2="140" y2="326" stroke="#00d4ff" stroke-width="1"/>
    <line x1="200" y1="14" x2="200" y2="326" stroke="#00d4ff" stroke-width="1"/>
  </g>

  <!-- Initials -->
  <g class="initials-float">
    <!-- Large background monogram -->
    <text x="140" y="196" text-anchor="middle" dominant-baseline="middle"
          font-family="monospace" font-size="96" font-weight="900"
          fill="#00d4ff" opacity="0.08">AD</text>
    <!-- Foreground initials -->
    <text x="140" y="185" text-anchor="middle" dominant-baseline="middle"
          font-family="monospace" font-size="64" font-weight="800"
          fill="#e8eef8">AD</text>
    <!-- Cyan dot accent -->
    <circle cx="186" cy="148" r="6" fill="#00d4ff" filter="url(#avatar-glow)"/>
  </g>

  <!-- Bottom label -->
  <rect x="40" y="280" width="200" height="28" rx="8" fill="#111a2e" stroke="#23314a" stroke-width="1"/>
  <text class="hint-blink" x="140" y="299" text-anchor="middle"
        font-family="monospace" font-size="11" fill="#9aa9bf">
    Add photo.jpg to /assets
  </text>

  <!-- Corner decorations -->
  <polyline points="20,40 14,40 14,14 40,14" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <polyline points="240,40 266,40 266,14 240,14" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <polyline points="20,300 14,300 14,326 40,326" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
  <polyline points="240,300 266,300 266,326 240,326" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
</svg>
