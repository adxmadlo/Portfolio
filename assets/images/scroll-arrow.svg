<svg viewBox="0 0 40 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Scroll down indicator" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .arrow-1 { animation: scrollPulse 2s 0.0s ease-in-out infinite; }
      .arrow-2 { animation: scrollPulse 2s 0.3s ease-in-out infinite; }
      .arrow-3 { animation: scrollPulse 2s 0.6s ease-in-out infinite; }
      @keyframes scrollPulse {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 0.9; }
      }
      .line-anim {
        animation: lineGrow 1.5s ease-out infinite;
        transform-origin: 20px 0;
      }
      @keyframes lineGrow {
        0% { stroke-dashoffset: 20; }
        100% { stroke-dashoffset: -20; }
      }
    </style>
  </defs>
  <!-- Vertical line -->
  <line x1="20" y1="2" x2="20" y2="30" stroke="#00d4ff" stroke-width="1.5"
        stroke-dasharray="6 4" class="line-anim" opacity="0.5"/>
  <!-- Three chevrons cascading down -->
  <polyline class="arrow-1" points="12,28 20,36 28,28" fill="none" stroke="#00d4ff" stroke-width="1.8" stroke-linecap="round"/>
  <polyline class="arrow-2" points="12,36 20,44 28,36" fill="none" stroke="#00d4ff" stroke-width="1.8" stroke-linecap="round"/>
  <polyline class="arrow-3" points="12,44 20,52 28,44" fill="none" stroke="#00d4ff" stroke-width="1.8" stroke-linecap="round"/>
</svg>
