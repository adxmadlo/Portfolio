<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IoT circuit animation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      /* Data pulse travelling along the circuit */
      .pulse-1 { animation: travel1 3.2s 0s linear infinite; }
      .pulse-2 { animation: travel2 3.2s 1.1s linear infinite; }
      .pulse-3 { animation: travel3 3.2s 2.2s linear infinite; }

      @keyframes travel1 {
        0%   { stroke-dashoffset: 200; opacity: 0; }
        5%   { opacity: 1; }
        95%  { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes travel2 {
        0%   { stroke-dashoffset: 200; opacity: 0; }
        5%   { opacity: 1; }
        95%  { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes travel3 {
        0%   { stroke-dashoffset: 200; opacity: 0; }
        5%   { opacity: 1; }
        95%  { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }

      /* CPU chip glow */
      .chip-glow { animation: chipPulse 2s ease-in-out infinite; }
      @keyframes chipPulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.9; }
      }

      /* Sensor dot blips */
      .sensor-blip { animation: blip 2.5s ease-in-out infinite; }
      .sensor-blip-2 { animation: blip 2.5s 0.8s ease-in-out infinite; }
      .sensor-blip-3 { animation: blip 2.5s 1.6s ease-in-out infinite; }
      @keyframes blip {
        0%, 100% { r: 3; opacity: 0.5; }
        50% { r: 6; opacity: 1; }
      }
    </style>

    <filter id="iot-glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="#0a0f1e" rx="12"/>

  <!-- Grid pattern -->
  <line x1="0" y1="50"  x2="200" y2="50"  stroke="#23314a" stroke-width="0.5"/>
  <line x1="0" y1="100" x2="200" y2="100" stroke="#23314a" stroke-width="0.5"/>
  <line x1="0" y1="150" x2="200" y2="150" stroke="#23314a" stroke-width="0.5"/>
  <line x1="50"  y1="0" x2="50"  y2="200" stroke="#23314a" stroke-width="0.5"/>
  <line x1="100" y1="0" x2="100" y2="200" stroke="#23314a" stroke-width="0.5"/>
  <line x1="150" y1="0" x2="150" y2="200" stroke="#23314a" stroke-width="0.5"/>

  <!-- Circuit traces (static) -->
  <polyline points="40,100 75,100 75,60 125,60 125,100 160,100"
            fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/>
  <polyline points="100,60 100,30"
            fill="none" stroke="#1e3a5f" stroke-width="2"/>
  <polyline points="100,140 100,170"
            fill="none" stroke="#1e3a5f" stroke-width="2"/>
  <polyline points="40,100 40,140 75,140 75,100"
            fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  <polyline points="160,100 160,140 125,140 125,100"
            fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Animated data pulses (travel along traces) -->
  <polyline class="pulse-1" points="40,100 75,100 75,60 125,60 125,100 160,100"
            fill="none" stroke="#00d4ff" stroke-width="2.5"
            stroke-dasharray="20 180" stroke-linecap="round"
            filter="url(#iot-glow)"/>
  <polyline class="pulse-2" points="100,60 100,30"
            fill="none" stroke="#f59e0b" stroke-width="2.5"
            stroke-dasharray="12 88" stroke-linecap="round"/>
  <polyline class="pulse-3" points="100,140 100,170"
            fill="none" stroke="#00d4ff" stroke-width="2.5"
            stroke-dasharray="12 88" stroke-linecap="round"
            filter="url(#iot-glow)"/>

  <!-- Main CPU chip -->
  <rect x="78" y="78" width="44" height="44" rx="4" fill="#111a2e" stroke="#00d4ff" stroke-width="1.5"/>
  <rect class="chip-glow" x="82" y="82" width="36" height="36" rx="3" fill="#00d4ff" opacity="0.3"/>
  <!-- Chip pins -->
  <line x1="78" y1="88" x2="72" y2="88" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="78" y1="96" x2="72" y2="96" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="78" y1="104" x2="72" y2="104" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="78" y1="112" x2="72" y2="112" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="122" y1="88" x2="128" y2="88" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="122" y1="96" x2="128" y2="96" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="122" y1="104" x2="128" y2="104" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="122" y1="112" x2="128" y2="112" stroke="#00d4ff" stroke-width="1.5"/>
  <!-- Chip label -->
  <text x="100" y="105" text-anchor="middle" font-family="monospace" font-size="10" fill="#00d4ff" font-weight="bold">IoT</text>

  <!-- Sensor nodes -->
  <!-- Top sensor (temperature) -->
  <circle cx="100" cy="25" r="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <circle class="sensor-blip" cx="100" cy="25" r="3" fill="#f59e0b"/>
  <text x="100" y="29" text-anchor="middle" font-family="monospace" font-size="6" fill="#f59e0b">T°</text>

  <!-- Bottom sensor (humidity) -->
  <circle cx="100" cy="175" r="10" fill="#111a2e" stroke="#00d4ff" stroke-width="1.5"/>
  <circle class="sensor-blip-2" cx="100" cy="175" r="3" fill="#00d4ff"/>
  <text x="100" y="179" text-anchor="middle" font-family="monospace" font-size="6" fill="#00d4ff">H%</text>

  <!-- Left node (input) -->
  <circle cx="34" cy="100" r="8" fill="#111a2e" stroke="#23314a" stroke-width="1.5"/>
  <circle class="sensor-blip-3" cx="34" cy="100" r="3" fill="#4ade80"/>

  <!-- Right node (output/alert) -->
  <circle cx="166" cy="100" r="8" fill="#111a2e" stroke="#23314a" stroke-width="1.5"/>
  <circle class="sensor-blip" cx="166" cy="100" r="3" fill="#fb7185" style="animation-delay:1.2s"/>
</svg>
