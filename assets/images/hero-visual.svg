<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decorative code editor illustration" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Glow filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="rgba(0,0,0,0.5)"/>
    </filter>

    <!-- Gradient for card bg -->
    <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>

    <!-- Gradient for progress bars -->
    <linearGradient id="bar-php" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099bb"/>
    </linearGradient>
    <linearGradient id="bar-flutter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bar-js" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Animated dash for orbiting dot -->
    <style>
      /* Floating animation for the whole card */
      .float-card {
        animation: float 5s ease-in-out infinite;
        transform-origin: 240px 170px;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      /* Typing cursor blink */
      .cursor {
        animation: blink 1.1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* Progress bar fill animations */
      .bar-php { animation: barFill 2.4s 0.3s cubic-bezier(.4,0,.2,1) both; }
      .bar-flutter { animation: barFill 2.4s 0.7s cubic-bezier(.4,0,.2,1) both; }
      .bar-js { animation: barFill 2.4s 1.1s cubic-bezier(.4,0,.2,1) both; }
      @keyframes barFill {
        from { transform: scaleX(0); transform-origin: left; }
        to   { transform: scaleX(1); transform-origin: left; }
      }

      /* Orbiting dot around the ring */
      .orbit-dot {
        animation: orbit 4s linear infinite;
        transform-origin: 390px 62px;
      }
      @keyframes orbit {
        from { transform: rotate(0deg) translateX(22px) rotate(0deg); }
        to   { transform: rotate(360deg) translateX(22px) rotate(-360deg); }
      }

      /* Status ping pulse */
      .status-ring {
        animation: ping 1.8s ease-out infinite;
        transform-origin: 76px 37px;
      }
      @keyframes ping {
        0%   { transform: scale(1); opacity: 0.8; }
        70%  { transform: scale(2.2); opacity: 0; }
        100% { transform: scale(2.2); opacity: 0; }
      }

      /* Fade in for the whole SVG */
      .fade-in {
        animation: fadeIn 0.8s 0.2s both;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Particle twinkle */
      .p1 { animation: twinkle 2.3s 0.0s ease-in-out infinite; }
      .p2 { animation: twinkle 3.1s 0.8s ease-in-out infinite; }
      .p3 { animation: twinkle 2.7s 1.5s ease-in-out infinite; }
      .p4 { animation: twinkle 3.5s 0.4s ease-in-out infinite; }
      @keyframes twinkle {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.7; }
      }
    </style>
  </defs>

  <!-- Background particles / stars -->
  <circle class="p1" cx="22"  cy="48"  r="2" fill="#00d4ff"/>
  <circle class="p2" cx="455" cy="290" r="2" fill="#f59e0b"/>
  <circle class="p3" cx="460" cy="80"  r="1.5" fill="#00d4ff"/>
  <circle class="p4" cx="18"  cy="300" r="1.5" fill="#f59e0b"/>
  <circle class="p1" cx="240" cy="10"  r="1" fill="#00d4ff" style="animation-delay:1s"/>
  <circle class="p3" cx="35"  cy="175" r="1" fill="#f59e0b" style="animation-delay:0.3s"/>

  <!-- Floating card group -->
  <g class="float-card fade-in" filter="url(#shadow)">

    <!-- Main card body -->
    <rect x="30" y="24" width="420" height="292" rx="14" fill="url(#card-bg)" stroke="#23314a" stroke-width="1.5"/>

    <!-- Top bar -->
    <rect x="30" y="24" width="420" height="42" rx="14" fill="#151f35"/>
    <rect x="30" y="52" width="420" height="14" fill="#151f35"/>

    <!-- Traffic lights -->
    <circle cx="58"  cy="45" r="6" fill="#ff5f57"/>
    <circle cx="78"  cy="45" r="6" fill="#febc2e"/>
    <circle cx="98"  cy="45" r="6" fill="#28c840"/>

    <!-- File tab -->
    <rect x="120" y="33" width="96" height="24" rx="4" fill="#1e293b"/>
    <text x="140" y="49" font-family="monospace" font-size="10" fill="#9aa9bf">adama.dev</text>

    <!-- Status dot with ring -->
    <circle class="status-ring" cx="76" cy="37" r="5" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0"/>
    <circle cx="76" cy="37" r="5" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.3"/>

    <!-- ─── CODE BLOCK ─── -->
    <!-- Line numbers -->
    <text x="50"  y="95"  font-family="monospace" font-size="11" fill="#374151">1</text>
    <text x="50"  y="114" font-family="monospace" font-size="11" fill="#374151">2</text>
    <text x="50"  y="133" font-family="monospace" font-size="11" fill="#374151">3</text>
    <text x="50"  y="152" font-family="monospace" font-size="11" fill="#374151">4</text>
    <text x="50"  y="171" font-family="monospace" font-size="11" fill="#374151">5</text>
    <text x="50"  y="190" font-family="monospace" font-size="11" fill="#374151">6</text>
    <text x="50"  y="209" font-family="monospace" font-size="11" fill="#374151">7</text>
    <text x="50"  y="228" font-family="monospace" font-size="11" fill="#374151">8</text>
    <text x="50"  y="247" font-family="monospace" font-size="11" fill="#374151">9</text>

    <!-- Active line highlight -->
    <rect x="68" y="199" width="372" height="17" rx="3" fill="rgba(0,212,255,0.06)"/>

    <!-- Code text -->
    <text x="74" y="95"  font-family="monospace" font-size="11" fill="#687991">// Adama Diallo — Developer</text>
    <text x="74" y="114" font-family="monospace" font-size="11">
      <tspan fill="#00d4ff">const</tspan>
      <tspan fill="#e8eef8"> dev = {</tspan>
    </text>
    <text x="74" y="133" font-family="monospace" font-size="11">
      <tspan fill="#9aa9bf">  name: </tspan>
      <tspan fill="#f59e0b">"Adama Diallo"</tspan>
      <tspan fill="#9aa9bf">,</tspan>
    </text>
    <text x="74" y="152" font-family="monospace" font-size="11">
      <tspan fill="#9aa9bf">  city: </tspan>
      <tspan fill="#f59e0b">"Dakar, Senegal"</tspan>
      <tspan fill="#9aa9bf">,</tspan>
    </text>
    <text x="74" y="171" font-family="monospace" font-size="11">
      <tspan fill="#9aa9bf">  stack: </tspan>
      <tspan fill="#9aa9bf">[</tspan>
      <tspan fill="#f59e0b">"PHP"</tspan>
      <tspan fill="#9aa9bf">, </tspan>
      <tspan fill="#f59e0b">"Flutter"</tspan>
      <tspan fill="#9aa9bf">, </tspan>
      <tspan fill="#f59e0b">"JS"</tspan>
      <tspan fill="#9aa9bf">],</tspan>
    </text>
    <text x="74" y="190" font-family="monospace" font-size="11">
      <tspan fill="#9aa9bf">  focus: </tspan>
      <tspan fill="#f59e0b">"Web + Mobile + IoT"</tspan>
      <tspan fill="#9aa9bf">,</tspan>
    </text>
    <text x="74" y="209" font-family="monospace" font-size="11">
      <tspan fill="#9aa9bf">  open: </tspan>
      <tspan fill="#00d4ff">true</tspan>
      <tspan fill="#9aa9bf">,</tspan>
    </text>
    <text x="74" y="228" font-family="monospace" font-size="11">
      <tspan fill="#e8eef8">};</tspan>
    </text>

    <!-- Blinking cursor -->
    <rect class="cursor" x="92" y="239" width="8" height="13" rx="1" fill="#00d4ff"/>

    <!-- ─── SKILL BARS SECTION ─── -->
    <line x1="44" y1="258" x2="436" y2="258" stroke="#23314a" stroke-width="1"/>

    <!-- PHP / Laravel bar -->
    <text x="50" y="276" font-family="monospace" font-size="9" fill="#9aa9bf">PHP / Laravel</text>
    <text x="420" y="276" font-family="monospace" font-size="9" fill="#00d4ff" text-anchor="end">90%</text>
    <rect x="50" y="280" width="280" height="5" rx="2.5" fill="#1e293b"/>
    <rect class="bar-php" x="50" y="280" width="252" height="5" rx="2.5" fill="url(#bar-php)" filter="url(#glow-cyan)"/>

    <!-- Flutter bar -->
    <text x="50" y="298" font-family="monospace" font-size="9" fill="#9aa9bf">Flutter / Dart</text>
    <text x="420" y="298" font-family="monospace" font-size="9" fill="#f59e0b" text-anchor="end">82%</text>
    <rect x="50" y="302" width="280" height="5" rx="2.5" fill="#1e293b"/>
    <rect class="bar-flutter" x="50" y="302" width="229" height="5" rx="2.5" fill="url(#bar-flutter)"/>

    <!-- JS bar -->
    <text x="50" y="320" font-family="monospace" font-size="9" fill="#9aa9bf">JavaScript</text>
    <text x="420" y="320" font-family="monospace" font-size="9" fill="#00d4ff" text-anchor="end">85%</text>
    <rect x="50" y="324" width="280" height="5" rx="2.5" fill="#1e293b"/>
    <rect class="bar-js" x="50" y="324" width="239" height="5" rx="2.5" fill="url(#bar-js)" filter="url(#glow-cyan)"/>

  </g>

  <!-- Orbit ring (decorative, top-right) -->
  <circle cx="390" cy="62" r="22" fill="none" stroke="#23314a" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
  <circle class="orbit-dot" cx="390" cy="62" r="4" fill="#00d4ff" filter="url(#glow-cyan)"/>
</svg>
